<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================================
   郑东新区 CBD · 大玉米 · 微缩沙盘
   —— 全部几何 / 纹理程序化生成，无外部模型与贴图
   ========================================================================= */

const DEG = Math.PI / 180;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const smoothstep = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const easeOutCubic = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const easeOutBack = (x, s = 1.70158) => {
  x = clamp01(x);
  const c3 = s + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
};
const lerp = (a, b, t) => a + (b - a) * t;

/* 固定种子随机，保证每次加载布局/纹理一致 */
let rngState = 20261111;
function rnd() {
  rngState = (rngState * 1664525 + 1013904223) >>> 0;
  return rngState / 4294967296;
}

/* ============================ 渲染器 / 相机 ============================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const MAX_ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(37, window.innerWidth / window.innerHeight, 0.1, 900);
camera.position.set(26.5, 46.5, 70.0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 7.6, 0.6);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.75;
controls.zoomSpeed = 0.85;
controls.panSpeed = 0.7;
controls.minDistance = 20;
controls.maxDistance = 190;
controls.minPolarAngle = 8 * DEG;
controls.maxPolarAngle = 82 * DEG;
controls.screenSpacePanning = true;
controls.update();

/* ============================ 天空 / 环境 ============================ */
const skyUniforms = {
  topColor: { value: new THREE.Color(0x5b8fc9) },
  bottomColor: { value: new THREE.Color(0xffd3a1) },
};
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
  uniforms: skyUniforms,
  vertexShader: /* glsl */`
    varying vec3 vWorld;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    uniform vec3 topColor;
    uniform vec3 bottomColor;
    varying vec3 vWorld;
    void main() {
      vec3 d = normalize(vWorld);
      float h = clamp(d.y * 0.5 + 0.5, 0.0, 1.0);
      float k = smoothstep(0.30, 0.72, h);
      vec3 col = mix(bottomColor, topColor, k);
      float glow = pow(clamp(1.0 - abs(d.y - 0.06) * 7.0, 0.0, 1.0), 2.0) * 0.18;
      col += vec3(1.0, 0.68, 0.38) * glow;
      gl_FragColor = vec4(col, 1.0);
    }
  `,
});
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(420, 40, 24), skyMat);
skyDome.frustumCulled = false;
scene.add(skyDome);

/* 用 canvas 生成一张等距柱状环境图，经 PMREM 处理后供玻璃/金属反射 */
function buildEnvironment() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0.0, '#2d4f7d');
  grad.addColorStop(0.32, '#7ea9d4');
  grad.addColorStop(0.5, '#ffd6a4');
  grad.addColorStop(0.62, '#c78d5a');
  grad.addColorStop(1.0, '#20242c');
  g.fillStyle = grad;
  g.fillRect(0, 0, 512, 256);
  const sun = g.createRadialGradient(390, 118, 2, 390, 118, 72);
  sun.addColorStop(0, 'rgba(255,246,220,0.95)');
  sun.addColorStop(0.25, 'rgba(255,210,140,0.5)');
  sun.addColorStop(1, 'rgba(255,180,100,0)');
  g.fillStyle = sun;
  g.fillRect(300, 30, 190, 190);
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = pmrem.fromEquirectangular(tex).texture;
  pmrem.dispose();
  tex.dispose();
  return env;
}
scene.environment = buildEnvironment();

/* ============================ 灯光 ============================ */
const hemi = new THREE.HemisphereLight(0xdce8ff, 0xffbd80, 0.95);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffb06b, 2.65);
sun.position.set(30, 48, 22);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -34;
sun.shadow.camera.right = 34;
sun.shadow.camera.top = 36;
sun.shadow.camera.bottom = -34;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 150;
sun.shadow.bias = -0.0007;
sun.shadow.normalBias = 0.025;
scene.add(sun);
scene.add(sun.target);
sun.target.position.set(0, 0, 0);

const fill = new THREE.DirectionalLight(0xffd2b0, 0.42);
fill.position.set(-34, 18, -26);
scene.add(fill);

const ambient = new THREE.AmbientLight(0xfff2e0, 0.16);
scene.add(ambient);

/* 大玉米夜间暖光、路灯点光 */
const cornGlowLight = new THREE.PointLight(0xffb45e, 0, 42, 1.8);
cornGlowLight.position.set(-1.6, 23, -4.4);
scene.add(cornGlowLight);
const sweepLight = new THREE.PointLight(0xffe2a8, 0, 16, 2.0);
sweepLight.position.set(-1.6, 4, -4.4);
scene.add(sweepLight);

/* 星星（夜景淡入） */
const starGeo = new THREE.BufferGeometry();
{
  const arr = [];
  for (let i = 0; i < 520; i++) {
    const a = rnd() * Math.PI * 2;
    const y = 0.06 + rnd() * 0.94;
    const r = Math.sqrt(1 - y * y);
    arr.push(Math.cos(a) * r * 360, y * 360, Math.sin(a) * r * 360);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
}
const starMat = new THREE.PointsMaterial({
  color: 0xd8e6ff, size: 1.6, sizeAttenuation: false,
  transparent: true, opacity: 0, depthWrite: false,
});
const stars = new THREE.Points(starGeo, starMat);
stars.frustumCulled = false;
scene.add(stars);

/* ============================ 纹理工厂 ============================ */
function makeCanvas(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  return c;
}
function canvasTexture(w, h, draw, opts = {}) {
  const tex = new THREE.CanvasTexture(makeCanvas(w, h, draw));
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = MAX_ANISO;
  if (opts.repeat) tex.repeat.set(opts.repeat[0], opts.repeat[1]);
  if (opts.srgb !== false) tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

/* ---------- 大玉米：金色菱形幕墙（一格一菱形 + 玉米粒高光） ---------- */
function paintGoldTile(g, S, lines = true) {
  // 金黄底
  const grad = g.createLinearGradient(0, 0, S, S);
  grad.addColorStop(0, '#b9822c');
  grad.addColorStop(0.35, '#d8a748');
  grad.addColorStop(0.62, '#f0c96a');
  grad.addColorStop(1, '#b8812b');
  g.fillStyle = grad;
  g.fillRect(0, 0, S, S);

  // 细碎金粉噪点
  for (let i = 0; i < 1400; i++) {
    const x = rnd() * S, y = rnd() * S;
    g.fillStyle = rnd() > 0.5 ? 'rgba(255,238,190,0.16)' : 'rgba(80,48,10,0.13)';
    g.fillRect(x, y, 1.5 + rnd() * 2.5, 1.5 + rnd() * 2.5);
  }

  // 玉米粒高光：菱形中心 + 四角（四角拼合后同样完整）
  const grain = (cx, cy, s) => {
    g.save();
    g.translate(cx, cy);
    g.rotate(Math.PI / 4);
    const gg = g.createRadialGradient(0, -s * 0.2, 1, 0, 0, s);
    gg.addColorStop(0, 'rgba(255,248,214,0.95)');
    gg.addColorStop(0.45, 'rgba(255,222,140,0.55)');
    gg.addColorStop(1, 'rgba(255,205,105,0.0)');
    g.fillStyle = gg;
    g.beginPath();
    g.ellipse(0, 0, s * 0.5, s, 0, 0, Math.PI * 2);
    g.fill();
    g.strokeStyle = 'rgba(255,239,190,0.5)';
    g.lineWidth = S * 0.008;
    g.stroke();
    g.restore();
  };
  grain(S * 0.5, S * 0.5, S * 0.13);
  grain(0, 0, S * 0.13);
  grain(S, 0, S * 0.13);
  grain(0, S, S * 0.13);
  grain(S, S, S * 0.13);

  if (lines) {
    // 斜向交叉网格（周期 = S，保证无缝平铺）
    const lw = S * 0.021;
    const stroke = (x0, y0, x1, y1) => {
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    };
    g.lineCap = 'square';
    g.strokeStyle = 'rgba(96,58,12,0.72)';
    g.lineWidth = lw;
    for (let k = -1; k <= 1; k++) {
      stroke(0, k * S, S, k * S + S);
      stroke(0, k * S + S, S, k * S);
    }
    g.strokeStyle = 'rgba(255,228,154,0.55)';
    g.lineWidth = lw * 0.38;
    for (let k = -1; k <= 1; k++) {
      stroke(0, k * S, S, k * S + S);
      stroke(0, k * S + S, S, k * S);
    }
  }
}
const goldTex = canvasTexture(512, 512, (g, w, h) => paintGoldTile(g, w), { repeat: [24, 48] });
const goldGridTex = canvasTexture(512, 512, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  g.lineCap = 'square';
  g.shadowColor = 'rgba(255,214,120,0.9)';
  g.shadowBlur = 14;
  g.strokeStyle = 'rgba(255,232,170,0.95)';
  g.lineWidth = 12;
  for (let k = -1; k <= 1; k++) {
    g.beginPath(); g.moveTo(0, k * h); g.lineTo(w, k * h + w); g.stroke();
    g.beginPath(); g.moveTo(0, k * h + h); g.lineTo(w, k * h); g.stroke();
  }
  g.shadowBlur = 0;
  g.strokeStyle = 'rgba(255,250,225,0.9)';
  g.lineWidth = 4;
  for (let k = -1; k <= 1; k++) {
    g.beginPath(); g.moveTo(0, k * h); g.lineTo(w, k * h + w); g.stroke();
    g.beginPath(); g.moveTo(0, k * h + h); g.lineTo(w, k * h); g.stroke();
  }
}, { repeat: [24, 48] });

/* ---------- 玻璃幕墙（漫反射 + 夜间亮窗自发光） ---------- */
function makeFacadeTextures(seed, cols, rows, opts = {}) {
  let local = seed >>> 0;
  const rr = () => { local = (local * 1664525 + 1013904223) >>> 0; return local / 4294967296; };
  const S = 512, margin = 10;
  const diff = makeCanvas(S, S, (g) => {
    const grad = g.createLinearGradient(0, 0, S * 0.4, S);
    grad.addColorStop(0, opts.baseA || '#33485c');
    grad.addColorStop(0.5, opts.baseB || '#6d8497');
    grad.addColorStop(1, opts.baseC || '#263644');
    g.fillStyle = grad; g.fillRect(0, 0, S, S);
    // 建筑结构竖梃
    g.fillStyle = opts.mullion || 'rgba(196,208,216,0.55)';
    const cw = (S - margin * 2) / cols;
    for (let c = 0; c <= cols; c++) g.fillRect(margin + c * cw - 1.2, 0, 2.4, S);
    for (let r = 0; r <= rows; r++) {
      const yy = margin + r * ((S - margin * 2) / rows);
      g.fillRect(0, yy - 1.2, S, 2.4);
    }
    const rh = (S - margin * 2) / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const x = margin + c * cw + 2.5;
        const y = margin + r * rh + 2.5;
        const w = cw - 5, hh = rh - 5;
        const t = rr();
        g.fillStyle = t > 0.88
          ? 'rgba(232,241,247,0.85)'
          : t > 0.55
            ? `rgba(${92 + rr() * 40 | 0},${124 + rr() * 40 | 0},${150 + rr() * 45 | 0},0.92)`
            : `rgba(${26 + rr() * 22 | 0},${42 + rr() * 26 | 0},${56 + rr() * 28 | 0},0.95)`;
        g.fillRect(x, y, w, hh);
        if (opts.balcony && r % 4 === 3) {
          g.fillStyle = 'rgba(216,203,182,0.85)';
          g.fillRect(x - 2, y + hh - 1, w + 4, 4);
        }
      }
    }
    // 底部裙楼灯带
    g.fillStyle = 'rgba(228,222,205,0.72)';
    g.fillRect(0, S - 12, S, 12);
  });

  const emis = makeCanvas(S, S, (g) => {
    g.fillStyle = '#000000'; g.fillRect(0, 0, S, S);
    const cw = (S - margin * 2) / cols;
    const rh = (S - margin * 2) / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (rr() > (opts.litChance ?? 0.34)) continue;
        const x = margin + c * cw + 3.5;
        const y = margin + r * rh + 3.5;
        const w = cw - 7, hh = rh - 7;
        const warm = rr() > 0.38;
        const a = 0.55 + rr() * 0.45;
        g.fillStyle = warm
          ? `rgba(255,${186 + rr() * 40 | 0},${96 + rr() * 45 | 0},${a})`
          : `rgba(${160 + rr() * 45 | 0},${208 + rr() * 35 | 0},255,${a})`;
        g.fillRect(x, y, w, hh);
      }
    }
    // 底部大堂亮灯
    g.fillStyle = 'rgba(255,196,120,0.85)';
    g.fillRect(0, S - 14, S, 14);
  });

  const map = new THREE.CanvasTexture(diff);
  map.colorSpace = THREE.SRGBColorSpace;
  map.anisotropy = MAX_ANISO;
  const emissiveMap = new THREE.CanvasTexture(emis);
  emissiveMap.colorSpace = THREE.SRGBColorSpace;
  emissiveMap.anisotropy = MAX_ANISO;
  return { map, emissiveMap };
}

/* ---------- 沥青 / 草地 / 水面 ---------- */
const asphaltTex = canvasTexture(256, 256, (g, w, h) => {
  g.fillStyle = '#3b3f46'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 5000; i++) {
    const v = 40 + rnd() * 36 | 0;
    g.fillStyle = `rgba(${v},${v},${v + 3},${0.25 + rnd() * 0.4})`;
    g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2);
  }
}, { repeat: [4, 4] });

const grassTex = canvasTexture(256, 256, (g, w, h) => {
  g.fillStyle = '#4d7c3c'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 3200; i++) {
    const t = rnd();
    g.fillStyle = t > 0.66 ? 'rgba(111,150,74,0.8)'
      : t > 0.33 ? 'rgba(58,105,50,0.75)'
        : 'rgba(134,157,84,0.55)';
    g.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 5, 1 + rnd() * 3);
  }
}, { repeat: [0.22, 0.22] });

const waterBump = canvasTexture(256, 256, (g, w, h) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) {
    const x = rnd() * w, y = rnd() * h;
    const r = 3 + rnd() * 16;
    const gg = g.createRadialGradient(x, y, 0, x, y, r);
    const light = rnd() > 0.5;
    gg.addColorStop(0, light ? 'rgba(255,255,255,0.32)' : 'rgba(0,0,0,0.28)');
    gg.addColorStop(1, 'rgba(128,128,128,0)');
    g.fillStyle = gg;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
}, { srgb: false, repeat: [1, 1] });

const glowTex = canvasTexture(128, 128, (g, w, h) => {
  const gg = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gg.addColorStop(0, 'rgba(255,255,255,1)');
  gg.addColorStop(0.22, 'rgba(255,235,190,0.75)');
  gg.addColorStop(0.55, 'rgba(255,190,110,0.22)');
  gg.addColorStop(1, 'rgba(255,170,80,0)');
  g.fillStyle = gg; g.fillRect(0, 0, w, h);
});

/* ---------- 广告牌 ---------- */
function billboardTexture(title, sub, accent) {
  return canvasTexture(512, 256, (g, w, h) => {
    const bg = g.createLinearGradient(0, 0, w, h);
    bg.addColorStop(0, '#0d1d2c');
    bg.addColorStop(1, '#123047');
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(232,190,106,0.95)';
    g.lineWidth = 10;
    g.strokeRect(6, 6, w - 12, h - 12);
    g.fillStyle = accent || '#f4d28a';
    g.fillRect(30, 34, 9, h - 68);
    g.fillStyle = '#f3ead7';
    g.font = '700 76px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif';
    g.textBaseline = 'middle';
    g.fillText(title, 62, 96);
    g.fillStyle = accent || '#e8be6a';
    g.font = '500 34px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText(sub, 64, 176);
    g.fillStyle = 'rgba(232,190,106,0.55)';
    g.fillRect(64, 206, 220, 3);
  });
}

/* ============================ 材质 ============================ */
const baseMat = new THREE.MeshStandardMaterial({ color: 0x2b3138, roughness: 0.72, metalness: 0.35 });
const baseTrimMat = new THREE.MeshStandardMaterial({ color: 0xb08c48, roughness: 0.35, metalness: 0.85 });
const lawnMat = new THREE.MeshStandardMaterial({ map: grassTex, color: 0xdfe7d0, roughness: 0.96, metalness: 0.0 });
const plazaMat = new THREE.MeshStandardMaterial({ color: 0xcac2ae, roughness: 0.88, metalness: 0.03 });
const plazaDarkMat = new THREE.MeshStandardMaterial({ color: 0x9b9384, roughness: 0.9, metalness: 0.02 });
const roadMat = new THREE.MeshStandardMaterial({ map: asphaltTex, color: 0xa9adb4, roughness: 0.94, metalness: 0.02 });
const laneMat = new THREE.MeshStandardMaterial({ color: 0xf0eee2, roughness: 0.55, metalness: 0.0 });
const laneWarmMat = new THREE.MeshStandardMaterial({ color: 0xe3c169, roughness: 0.6, metalness: 0.05 });
const walkwayMat = new THREE.MeshStandardMaterial({ color: 0xcfc6ad, roughness: 0.9, metalness: 0.02 });
const stoneMat = new THREE.MeshStandardMaterial({ color: 0xbfb6a1, roughness: 0.82, metalness: 0.04 });
const woodMat = new THREE.MeshStandardMaterial({ color: 0x8a5f3c, roughness: 0.85, metalness: 0.02 });
const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x2f343a, roughness: 0.55, metalness: 0.6 });
const roofMat = new THREE.MeshStandardMaterial({ color: 0x333c46, roughness: 0.68, metalness: 0.3 });
const whiteRoofMat = new THREE.MeshStandardMaterial({ color: 0xd9d6cc, roughness: 0.5, metalness: 0.35 });
const eggMat = new THREE.MeshStandardMaterial({ color: 0x8fa3b2, roughness: 0.22, metalness: 0.78, envMapIntensity: 0.85 });
const goldMat = new THREE.MeshStandardMaterial({ color: 0xd6a94f, roughness: 0.3, metalness: 0.85, envMapIntensity: 1.0 });

const glassSets = [];
const windowMats = [];
function glassMaterial(seed, cols, rows, opts) {
  const t = makeFacadeTextures(seed, cols, rows, opts);
  const mat = new THREE.MeshStandardMaterial({
    map: t.map,
    emissiveMap: t.emissiveMap,
    emissive: new THREE.Color(0xffffff),
    emissiveIntensity: 0.03,
    color: 0xffffff,
    roughness: 0.22,
    metalness: 0.55,
    envMapIntensity: 0.9,
  });
  mat.userData.dayEmissive = opts.dayEmissive ?? 0.03;
  mat.userData.nightEmissive = opts.nightEmissive ?? 1.35;
  windowMats.push(mat);
  glassSets.push(mat);
  return mat;
}
const glassA = glassMaterial(11, 12, 24, {
  baseA: '#2f475d', baseB: '#778da0', baseC: '#20303e', litChance: 0.36, nightEmissive: 1.45,
});
const glassB = glassMaterial(29, 10, 22, {
  baseA: '#274353', baseB: '#6b8894', baseC: '#1b2b36', litChance: 0.3, nightEmissive: 1.25,
  mullion: 'rgba(184,201,207,0.5)',
});
const glassC = glassMaterial(53, 8, 18, {
  baseA: '#4c4a46', baseB: '#8e8b80', baseC: '#2a2a28', litChance: 0.4, nightEmissive: 1.5,
  mullion: 'rgba(214,205,186,0.55)',
});

function makeShape(points, holes = []) {
  const s = new THREE.Shape();
  points.forEach((p, i) => (i ? s.lineTo(p.x, p.y) : s.moveTo(p.x, p.y)));
  s.closePath();
  for (const h of holes) {
    const path = new THREE.Path();
    h.forEach((p, i) => (i ? path.lineTo(p.x, p.y) : path.moveTo(p.x, p.y)));
    path.closePath();
    s.holes.push(path);
  }
  return s;
}

/* ============================ 动画注册表 ============================ */
const animItems = [];
function addAnim(obj, start, dur, mode = 'rise', opt = {}) {
  obj.visible = false;
  const item = {
    obj, start, dur, mode,
    from: opt.from ?? 0,
    baseY: obj.position.y,
    baseScale: obj.scale.clone(),
    dist: opt.dist ?? 2.0,
    axis: opt.axis ?? 'x',
  };
  animItems.push(item);
  return item;
}
function updateAnims(t) {
  for (const a of animItems) {
    if (t < a.start) { a.obj.visible = false; continue; }
    a.obj.visible = true;
    const p = clamp01((t - a.start) / a.dur);
    if (a.mode === 'rise') {
      const e = easeOutBack(p, 1.25);
      a.obj.scale.set(a.baseScale.x, Math.max(0.0001, a.baseScale.y * (a.from + (1 - a.from) * e)), a.baseScale.z);
    } else if (a.mode === 'drop') {
      const e = easeOutCubic(p);
      a.obj.position.y = a.baseY - (1 - e) * a.dist;
      if (p >= 1) a.obj.position.y = a.baseY;
    } else if (a.mode === 'flat') {
      const e = easeOutBack(p, 1.0);
      const k = a.from + (1 - a.from) * e;
      a.obj.scale.set(a.baseScale.x * k, a.baseScale.y, a.baseScale.z * k);
    } else if (a.mode === 'growX' || a.mode === 'growZ') {
      const e = easeOutCubic(p);
      const k = a.from + (1 - a.from) * e;
      if (a.mode === 'growX') a.obj.scale.set(a.baseScale.x * k, a.baseScale.y, a.baseScale.z);
      else a.obj.scale.set(a.baseScale.x, a.baseScale.y, a.baseScale.z * k);
    } else if (a.mode === 'pop') {
      const e = easeOutBack(p, 1.9);
      const k = a.from + (1 - a.from) * e;
      a.obj.scale.copy(a.baseScale).multiplyScalar(k);
    }
  }
}

function addCrosswalk(angle, radius, y) {
  const g = new THREE.Group();
  g.position.set(Math.sin(angle) * radius, y, Math.cos(angle) * radius);
  g.rotation.y = angle;
  for (let i = 0; i < 6; i++) {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.012, 0.2), laneMat);
    bar.position.set(0, 0, -1.0 + i * 0.4);
    g.add(bar);
  }
  scene.add(g);
  return g;
}

const cornProfileCtrl = [

  [0.65, 0.90], [0.78, 0.80], [0.88, 0.66], [0.95, 0.48], [1.0, 0.18],
];
const cornCurve = new THREE.SplineCurve(cornProfileCtrl.map(([y, r]) => new THREE.Vector2(y, r)));
const cornSamples = cornCurve.getPoints(96).map((p) => ({ y: p.x, r: Math.max(0.035, p.y) }));

const cornGridSegs = [];

function cornRadiusAt(y) {
  const ss = cornSamples;
  if (y <= ss[0].y) return ss[0].r;
  if (y >= ss[ss.length - 1].y) return ss[ss.length - 1].r;
  for (let i = 0; i < ss.length - 1; i++) {
    if (y >= ss[i].y && y <= ss[i + 1].y) {
      const k = (y - ss[i].y) / Math.max(1e-6, ss[i + 1].y - ss[i].y);
      return lerp(ss[i].r, ss[i + 1].r, k);
    }
  }
  return ss[ss.length - 1].r;
}

function buildCornSegment(y0N, y1N, index) {
  const inner = cornSamples.filter((p) => p.y > y0N + 1e-4 && p.y < y1N - 1e-4);
  const pts = [{ y: y0N, r: cornRadiusAt(y0N) }, ...inner, { y: y1N, r: cornRadiusAt(y1N) }];
  if (pts.length < 2) return;
  const RADIAL = 76;
  const y0W = CORN_BASE_Y + y0N * CORN_H;
  const y1W = CORN_BASE_Y + y1N * CORN_H;
  const localPts = pts.map((p) => new THREE.Vector2(p.r * CORN_R, (p.y - y0N) * CORN_H));
  const geo = new THREE.LatheGeometry(localPts, RADIAL);
  const nP = localPts.length;
  const uv = geo.attributes.uv;
  for (let i = 0; i <= RADIAL; i++) {
    for (let j = 0; j < nP; j++) {
      const idx = i * nP + j;
      const globalV = y0N + (j / (nP - 1)) * (y1N - y0N);
      uv.setXY(idx, i / RADIAL, globalV);
    }
  }
  uv.needsUpdate = true;
  geo.computeVertexNormals();

  const segGroup = new THREE.Group();
  segGroup.position.y = y0W;
  const mesh = new THREE.Mesh(geo, cornMat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  segGroup.add(mesh);

  const gridMat = new THREE.MeshBasicMaterial({
    map: goldGridTex, color: 0xffe5a8, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
    toneMapped: false,
  });
  const shell = new THREE.Mesh(geo, gridMat);
  shell.scale.set(1.012, 1.0, 1.012);
  shell.visible = true;
  segGroup.add(shell);
  cornGridSegs.push({ mesh: shell, mat: gridMat, start: 16.1 + index * 0.32 });

  cornBody.add(segGroup);
  cornSegGroups.push(segGroup);
  // 记录全局高度，用于倒影
  segGroup.userData.height = y0W;
  addAnim(segGroup, 11.45 + index * 0.8, 0.95, 'rise', { from: 0.01 });
}

/* ============================ 夜间状态 ============================ */
const daySkyTop = new THREE.Color(0x5b8fc9);
const daySkyBot = new THREE.Color(0xffd3a1);
const nightSkyTop = new THREE.Color(0x050a18);
const nightSkyBot = new THREE.Color(0x1c2b44);
const dayHemiSky = new THREE.Color(0xdce8ff);
const dayHemiGround = new THREE.Color(0xffbd80);
const nightHemiSky = new THREE.Color(0x2a3c5c);
const nightHemiGround = new THREE.Color(0x111a27);
const daySunCol = new THREE.Color(0xffb06b);
const nightSunCol = new THREE.Color(0x93b8e8);
const dayFillCol = new THREE.Color(0xffd2b0);
const nightFillCol = new THREE.Color(0x3a4f78);
const nightAmbient = new THREE.Color(0x2a3550);
const dayAmbient = new THREE.Color(0xfff2e0);
const state = {
  night: 0,
  nightTarget: 0,
  nightFrom: 0,
  nightStart: 0,
  driving: false,
};
const tmpColor = new THREE.Color();

function applyNight(n) {
  // 天空
  skyUniforms.topColor.value.copy(daySkyTop).lerp(nightSkyTop, n);
  skyUniforms.bottomColor.value.copy(daySkyBot).lerp(nightSkyBot, n);
  // 灯光
  hemi.color.copy(dayHemiSky).lerp(nightHemiSky, n);
  hemi.groundColor.copy(dayHemiGround).lerp(nightHemiGround, n);
  hemi.intensity = lerp(0.95, 0.36, n);
  sun.color.copy(daySunCol).lerp(nightSunCol, n);
  sun.intensity = lerp(2.65, 0.62, n);
  fill.color.copy(dayFillCol).lerp(nightFillCol, n);
  fill.intensity = lerp(0.42, 0.2, n);
  ambient.color.copy(dayAmbient).lerp(nightAmbient, n);
  ambient.intensity = lerp(0.16, 0.32, n);
  renderer.toneMappingExposure = lerp(1.06, 1.0, n);
  // 星星
  starMat.opacity = n * 0.85;

  // 大玉米
  cornMat.metalness = lerp(0.55, 0.3, n);
  cornMat.envMapIntensity = lerp(0.95, 0.3, n);
  cornMat.emissiveIntensity = lerp(cornMat.userData.dayEmissive ?? 0.16, 2.15, n);
  cornGlowLight.intensity = n * 26;
  cornHalo.material.opacity = n * 0.55;

  // 玻璃幕墙亮窗
  for (const m of windowMats) {
    m.emissiveIntensity = lerp(m.userData.dayEmissive, m.userData.nightEmissive, n);
  }
  // 路灯
  lampBulbMat.emissiveIntensity = lerp(0.08, 3.4, n);
  for (const l of lampLights) l.intensity = n * 11;
  for (const s of lampSprites) s.material.opacity = n * 0.85;
  headlightMat.emissiveIntensity = lerp(0.05, 2.2, n);

  // 湖面
  waterMat.color.copy(waterMat.userData.dayColor).lerp(waterMat.userData.nightColor, n);
  waterMat.opacity = lerp(0.74, 0.58, n);
  waterMat.roughness = lerp(0.075, 0.12, n);
  mirrorMat.opacity = lerp(0.34, 0.62, n);
  lakeGlowMat.opacity = n * 0.5;
  grassTint(n);
  shadowCatcherMat.opacity = lerp(0.26, 0.1, n);
}

function grassTint(n) {
  lawnMat.color.copy(dayLawnColor).lerp(nightLawnColor, n);
}
const dayLawnColor = new THREE.Color(0xdfe7d0);
const nightLawnColor = new THREE.Color(0x5c6a62);

/* ============================ 设施入场后的动态 ============================ */
/* 红绿灯循环 */
function updateTraffic(t) {
  const cycle = 8.0;
  const p = (t % cycle) / cycle;
  const active = p < 0.5 ? 2 : p < 0.62 ? 1 : 0;
  const base = [0x3a1010, 0x3a2c0d, 0x0d2c16];
  const bright = [0xff3b2e, 0xffcf3a, 0x38ff7a];
  const keys = ['red', 'yellow', 'green'];
  for (let i = 0; i < 3; i++) {
    trafficBulbMats[keys[i]].color.setHex(i === active ? bright[i] : base[i]);
  }
}

/* 车流 */
function updateCars(t, dt, n) {
  if (t < 23.4) return;
  for (const c of movingCars) {
    c.obj.visible = true;
    if (c.kind === 'ring') {
      c.angle += c.speed * dt;
      c.obj.position.x = Math.sin(c.angle) * c.radius;
      c.obj.position.z = Math.cos(c.angle) * c.radius;
      c.obj.rotation.y = c.angle + (c.speed > 0 ? Math.PI / 2 : -Math.PI / 2);
    } else {
      c.x += c.speed * dt;
      if (c.x > 21) c.x = -21;
      if (c.x < -21) c.x = 21;
      c.obj.position.x = c.x;
      c.obj.position.z = c.laneZ;
    }
  }
}

/* ============================ 主循环 ============================ */
const START_TIME = performance.now();
let lastNow = START_TIME;

function loop() {
  const now = performance.now();
  const t = Math.min(180, (now - START_TIME) / 1000);   // 组装按真实时间推进
  const dt = Math.min(0.06, (now - lastNow) / 1000);
  lastNow = now;

  // 日 / 夜：固定 1.5s 完成过渡（与帧率无关）
  if (state.night !== state.nightTarget) {
    const k = smoothstep((now - state.nightStart) / 1500);
    state.night = lerp(state.nightFrom, state.nightTarget, k);
    if (k >= 1) state.night = state.nightTarget;
  }
  const n = smoothstep(state.night);
  applyNight(n);
  updateAnims(t);

  // 金色菱形网格幕墙自下而上逐段覆盖
  for (const s of cornGridSegs) {
    const p = clamp01((t - s.start) / 0.78);
    const reveal = smoothstep(p);
    s.mat.opacity = reveal * (0.55 + 0.3 * n);
    s.mat.color.setHex(0xffe5a8).lerp(tmpColor.setHex(0xffc25c), n);
  }

  // 幕墙完成后一次金色高光由下往上扫过
  const sweepP = clamp01((t - 18.2) / 1.4);
  const sweep = (t >= 18.2 && t <= 19.6) ? Math.pow(Math.sin(sweepP * Math.PI), 2) : 0;
  if (sweep > 0) {
    sweepLight.position.y = 2 + sweepP * 26;
    sweepLight.intensity = sweep * 70 * (1 - n);
    cornMat.emissiveIntensity += sweep * 0.55 * (1 - n);
  } else {
    sweepLight.intensity = 0;
  }

  // 湖中倒影（随组装完成淡入）
  mirror.visible = t > 16.3;
  if (mirror.visible) {
    const fade = smoothstep(clamp01((t - 16.3) / 1.1));
    mirrorMat.opacity = lerp(0.34, 0.62, n) * fade;
    mirrorMat.color.setHex(0xffce72).lerp(tmpColor.setHex(0xffb04e), n);
  }

  updateTraffic(t);
  updateCars(t, dt, n);

  if (boat) {
    boat.position.y = 0.05 + Math.sin(t * 0.9) * 0.012;
    boat.rotation.z = Math.sin(t * 0.7) * 0.015;
  }

  waterBump.offset.x += dt * 0.006;
  waterBump.offset.y += dt * 0.003;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

/* 先渲染一帧再启动时钟，保证组装从 0 秒开始 */
renderer.render(scene, camera);
requestAnimationFrame(loop);

/* ============================ 键盘 / 尺寸 ============================ */
window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyN' || e.key === 'n' || e.key === 'N') {
    state.nightFrom = state.night;
    state.nightTarget = state.nightTarget > 0.5 ? 0 : 1;
    state.nightStart = performance.now();
  }
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
